name: CI

on:
  pull_request:

# 同一ブランチで新しい push が来たら走行中の古いランを止める（連投時の無駄削減）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 最小権限。テストはチェックアウト読み取りだけで十分（fork PR対策の明示）
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image (with cache)
        uses: docker/build-push-action@v6
        with:
          context: ./main
          file: ./main/Dockerfile
          target: prd            # デプロイ成果物そのものをテスト（dev版ではなく本番prd版）
          tags: metamon-ci:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run tests in image
        run: docker run --rm metamon-ci:test pytest tests
