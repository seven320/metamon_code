version: '3'

services:
    metamon:
        build: ./main
        container_name: hometamon
        restart: always
        tty: true
        depends_on:
            - firestore
        volumes:
            - ./main/state:/app/state
        environment:
            TZ: Asia/Tokyo
            # APP_ENV=dev を渡すと env/.env.dev（devコミュニティ用）を読む。未指定はprod。
            #   例) APP_ENV=dev docker compose up
            APP_ENV: ${APP_ENV:-}
            # ローカルは Firestore エミュレータに接続（本番 Cloud Run は ADC で実Firestore）
            GOOGLE_CLOUD_PROJECT: hometamon-local
            FIRESTORE_EMULATOR_HOST: firestore:8080

    # bot の永続状態（カーソル / 既知メンバー）を保持する Firestore エミュレータ。
    # 本番では Cloud Firestore を使うためデプロイ対象外（ローカル開発専用）。
    firestore:
        image: google/cloud-sdk:emulators
        command: gcloud emulators firestore start --host-port=0.0.0.0:8080 --project=hometamon-local
        ports:
            - "8080:8080"
